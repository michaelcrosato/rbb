name: Alpha checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [game, environment, rendering, multiplayer, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/${{ matrix.suite }}.spec.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  verify:
    needs: [checks, browser, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all code, browser and container checks
        run: |
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.browser.result }}" = "success"
          test "${{ needs.container.result }}" = "success"
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t rbb-world .
      - name: Verify container readiness and durable volume
        run: |
          docker run -d --name rbb -p 8787:8787 -e ALLOWED_ORIGINS=https://example.com -v rbb-data:/app/data rbb-world
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/health && break; sleep 1; done
          curl -fsS http://localhost:8787/health
          docker restart rbb
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/health && break; sleep 1; done
          curl -fsS http://localhost:8787/health
      - name: Container logs
        if: always()
        run: docker logs rbb
